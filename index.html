<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141A24" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>好惠修 · 口碑文案助手</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%231B212F'/><text x='32' y='45' font-size='38' font-weight='bold' text-anchor='middle' fill='%23F35803' font-family='PingFang SC,sans-serif'>好</text></svg>">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f5f6f8;--card:#fff;--fg:#1a1c20;--muted:#6b7280;--line:#e6e8ec;
  --chip:#f1f3f6;--chip-on:#FFF1E9;--brand:#F35803;--brand2:#FC9A2B;
  --head-bg1:#ffffff;--head-bg2:#FEF7F2;--head-fg:#1B212F;--head-dim:#6B7280;--head-line:rgba(27,33,47,.08);
  --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06);
  --r:16px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#12161F;--card:#1B212F;--fg:#ECEFF5;--muted:#96A0B0;--line:#2A3242;
  --chip:#232B3A;--chip-on:#3A2113;
  --head-bg1:#141A24;--head-bg2:#241A11;--head-fg:#fff;--head-dim:rgba(255,255,255,.55);--head-line:rgba(255,255,255,.1);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--fg);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  padding:0 0 calc(24px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:660px;margin:0 auto;padding:0 14px}
/* 顶栏 */
.topbar{position:relative;overflow:hidden;color:var(--head-fg);
  background:linear-gradient(170deg,var(--head-bg1) 0%,var(--head-bg2) 100%);
  padding:calc(14px + env(safe-area-inset-top)) 0 16px;
  box-shadow:0 1px 0 var(--head-line),0 8px 22px rgba(16,24,40,.05)}
/* 缓慢扫过的品牌光晕 */
.topbar:before{content:"";position:absolute;top:-90%;bottom:-90%;left:-12%;right:-12%;pointer-events:none;
  background:linear-gradient(180deg,transparent 34%,rgba(243,88,3,.08) 45%,rgba(252,154,43,.17) 51%,rgba(243,88,3,.08) 57%,transparent 68%);
  animation:sweep 28s linear infinite}
@keyframes sweep{0%{transform:translateY(-42%)}100%{transform:translateY(42%)}}
@media (prefers-reduced-motion:reduce){.topbar:before{animation:none}}
.topbar:after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;z-index:2;
  background:linear-gradient(90deg,var(--brand),var(--brand2) 42%,rgba(243,88,3,0) 100%)}
.topbar .wrap{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{height:92px;width:auto;display:block;flex:0 0 auto}
.brandtext{text-align:right}
.brandname{display:block;font-size:18px;font-weight:600;letter-spacing:.4px;line-height:1.3}
.tagline{display:block;margin-top:5px;font-size:11.5px;color:var(--head-dim);letter-spacing:.7px}
.only-dark{display:none}
@media (prefers-color-scheme:dark){.only-light{display:none}.only-dark{display:block}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.row{margin-bottom:16px}
.row:last-child{margin-bottom:0}
.lab{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:9px;display:flex;align-items:center;gap:6px}
.lab .opt{font-weight:400;color:var(--muted);opacity:.7}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  border:1px solid var(--line);background:var(--chip);color:var(--fg);
  border-radius:999px;padding:9px 14px;font-size:14px;line-height:1;
  cursor:pointer;user-select:none;transition:.15s;font-family:inherit;font-weight:500;
}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--chip-on);border-color:var(--brand);color:var(--brand);font-weight:700}
input[type=text],textarea{
  width:100%;background:var(--chip);border:1px solid var(--line);color:var(--fg);
  border-radius:12px;padding:12px 14px;font-size:16px;font-family:inherit;outline:none;
}
input[type=text]:focus,textarea:focus{border-color:var(--brand);background:var(--card)}
textarea{resize:vertical;min-height:62px;line-height:1.5}
.actions{display:flex;gap:10px;margin:2px 0 18px}
.btn{
  border:0;border-radius:14px;font-size:16px;font-weight:700;font-family:inherit;
  padding:15px 18px;cursor:pointer;transition:.15s;flex:1;min-height:52px;
}
.btn:active{transform:scale(.98)}
.btn.p{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 6px 18px rgba(243,88,3,.28);flex:2}
.btn.g{background:var(--chip);color:var(--fg);border:1px solid var(--line)}
.results{display:flex;flex-direction:column;gap:12px}
.res{position:relative;padding:16px}
.res .txt{margin:0;white-space:pre-wrap;word-break:break-word;font-size:16px;line-height:1.85}
.res .foot{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.res .len{font-size:12px;color:var(--muted)}
.cp{
  border:1px solid var(--brand);color:var(--brand);background:transparent;
  border-radius:10px;padding:8px 16px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;
}
.cp:active{background:var(--chip-on)}
.cp.done{background:var(--brand);color:#fff;border-color:var(--brand)}
.empty{color:var(--muted);text-align:center;padding:26px 10px;font-size:14px;line-height:1.9}
.tip{color:var(--muted);font-size:12.5px;text-align:center;line-height:1.9;padding:4px 10px 22px}
/* 去平台发布 */
.steps{margin:0 0 15px;padding-left:19px;color:var(--muted);font-size:13px;line-height:2}
.steps b{color:var(--fg);font-weight:600}
.steps li::marker{color:var(--brand);font-weight:700}
.plats{display:grid;grid-template-columns:1fr 1fr;gap:9px}
@media(min-width:560px){.plats{grid-template-columns:repeat(3,1fr)}}
.plat{display:flex;align-items:center;gap:8px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;
  background:var(--chip);border:1px solid var(--line);border-radius:11px;padding:12px 13px;color:var(--fg);
  transition:.15s;text-align:left}
.plat:active{transform:scale(.98)}
.plat i{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.plat em{font-style:normal}
.plat span{margin-left:auto;font-size:11px;font-weight:400;color:var(--muted);white-space:nowrap}
.plat.wide{grid-column:1/-1}
.plat.hot{border-color:var(--brand);background:#FFF3EC;box-shadow:0 0 0 2px rgba(243,88,3,.2)}
.phint{display:none;margin:13px 0 0;background:var(--chip);border-radius:12px;padding:13px 15px}
.phint.on{display:block}
.phint b{display:block;font-size:13px;color:var(--brand);margin-bottom:7px}
.phint span{display:block;font-size:13px;color:var(--muted);line-height:1.95}
#toast{
  position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translate(-50%,16px);
  background:rgba(20,22,26,.92);color:#fff;padding:11px 20px;border-radius:999px;font-size:14px;
  opacity:0;pointer-events:none;transition:.22s;z-index:99;backdrop-filter:blur(6px);
}
#toast.show{opacity:1;transform:translate(-50%,0)}
.badge{display:inline-block;background:var(--chip-on);color:var(--brand);font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;margin-left:2px}
</style>
</head>
<body>
<div class="topbar">
  <div class="wrap">
    <img class="logo only-light" src="assets/logo-on-light.png" alt="好惠修 家庭维修">
    <img class="logo only-dark" src="assets/logo-on-dark.png" alt="好惠修 家庭维修">
    <div class="brandtext">
      <span class="brandname">口碑文案助手</span>
      <span class="tagline">上门维修 · 顾客评价</span>
    </div>
  </div>
</div>
<div class="wrap">

  <div class="card">
    <div class="row">
      <div class="lab">店铺 / 商品名称 <span class="opt">选填</span></div>
      <input type="text" id="name" placeholder="例如：XX火锅（中山路店）" autocomplete="off">
    </div>

    <div class="row">
      <div class="lab">行业类型</div>
      <div class="chips" id="cats"></div>
    </div>

    <div class="row">
      <div class="lab">想夸的点 <span class="opt">可多选</span></div>
      <div class="chips" id="tags"></div>
    </div>

    <div class="row">
      <div class="lab">语气风格</div>
      <div class="chips" id="styles"></div>
    </div>

    <div class="row">
      <div class="lab">文案长度</div>
      <div class="chips" id="lens"></div>
    </div>

    <div class="row">
      <div class="lab">推荐力度</div>
      <div class="chips" id="powers"></div>
    </div>

    <div class="row">
      <div class="lab">补充真实细节 <span class="opt">选填，会织进文案</span></div>
      <textarea id="detail" placeholder="例如：点了双人套餐／做的奶茶三分糖／第二次来了"></textarea>
    </div>
  </div>

  <div class="actions">
    <button class="btn g" id="reroll">换一批</button>
    <button class="btn p" id="gen">生成文案</button>
  </div>

  <div class="results" id="out">
    <div class="card empty" id="empty">点「生成文案」，立刻出 3 条候选 👆</div>
  </div>

  <!--
    ============ 门店平台链接（老板填这里） ============
    有【本店】链接就粘到下面 script 里 PLATFORMS 的 link:'' 引号内 → 客户一键直达本店；
    link 留空也能用：会打开该平台的「搜索本店」页（用客户填的门店名去搜）。
      大众点评 / 美团：进店铺主页 → 分享 → 复制链接
      抖音：团购或门店页 → 分享 → 复制链接
      高德 / 百度地图：搜到本店 → 分享 → 复制链接
  -->
  <div class="card">
    <div class="lab" style="margin-bottom:13px">下一步：去平台发布</div>
    <ol class="steps">
      <li>选一条<b>复制</b>（点平台也会自动帮你复制）</li>
      <li>到评价框<b>长按 → 粘贴</b>，发出去</li>
    </ol>
    <div class="plats" id="plats"></div>
    <p class="phint" id="phint"></p>
  </div>

  <div class="tip">
    生成的文案可自由修改 · 加上自己的真实细节会更自然<br>
    把链接发到微信 / 群聊 / 打印成二维码，别人用手机也能直接打开
  </div>
</div>
<div id="toast">已复制</div>

<script>
/* ================== 门店配置：老板只改这里 ==================
   SHOP_NAME = 门店名（客户没填"店铺/商品名称"时，搜索本店用的就是它）
   PLATFORMS：
     link   = 本店链接，填了就一键直达本店（留空则打开该平台搜本店）
     search = 搜索页模板，{kw} 会被替换成门店名，一般不用改
   ========================================================== */
var SHOP_NAME='好惠修 家庭维修';
/* 微信小程序入口：微信里扫出来的「#小程序://...」口令，原样粘到这里。
   客户点「微信里打开美团」会把这条口令复制走，粘到微信聊天框点亮即可进美团小程序。 */
var WX_MP='#小程序://美团丨外卖团购特价美食酒店电影/8voPMxBGRu6OMi';
var PLATFORMS=[
  {name:'大众点评',color:'#FF6633',link:'',order:1,home:'https://m.dianping.com/',
   search:'https://www.dianping.com/search/keyword/1/0_{kw}'},
  {name:'美团',    color:'#FFC300',link:'',order:1,home:'https://i.meituan.com/',
   scheme:'imeituan://www.meituan.com/order/list',
   search:'https://i.meituan.com/s/{kw}'},
  {name:'抖音',    color:'#FE2C55',link:'',home:'https://www.douyin.com/',
   search:'https://www.douyin.com/search/{kw}'},
  {name:'高德地图',color:'#1677FF',link:'',home:'https://www.amap.com/',
   search:'https://uri.amap.com/search?keyword={kw}&view=map'},
  {name:'百度地图',color:'#2932E1',link:'',home:'https://map.baidu.com/',
   search:'https://map.baidu.com/mobile/webapp/search/search/qt=s&wd={kw}'},
  {name:'小红书',  color:'#FF2442',link:'',home:'https://www.xiaohongshu.com/',
   search:'https://www.xiaohongshu.com/search_result?keyword={kw}'}
];

/* ---------- 数据：标签（= 句子维度） ---------- */
var A = {
  taste:{label:'味道好',l:['{thing}味道很正，能吃出是用心做的。','味道比预想的好，咸淡刚好，一点都不腻。','入口就知道没白来，这个味道很有记忆点。','是那种很实在的好吃，不是靠调料堆出来的。'],s:['味道是真的可以。','好吃，没踩雷。']},
  portion:{label:'分量足',l:['分量给得实在，一个人吃差点没吃完。','这个价位能有这个分量，真的少见。','上桌的时候愣了一下，量是真的很足。','两个人点两个菜就够，不用硬凑单。'],s:['分量很足。','量给得实在。']},
  material:{label:'用料实在',l:['用料能吃出来，不是那种糊弄的。','食材新鲜，细品就知道差不了。','该用的料一点没省，这点很难得。','食材本味保留得很好，没被盖住。'],s:['用料很实在。','食材很新鲜。']},
  quality:{label:'品质在线',l:['整体品质在线，没有敷衍的感觉。','对比过同价位的几家，这家做得更细。','做得比想象中更认真，超出预期。','整体没什么短板，挺满意的。'],s:['品质不错。','比预期还好。']},
  value:{label:'性价比高',l:['这个价格能有这个体验，性价比是真的高。','同样的钱在这儿花得更值。','价格很实在，不玩虚的，花得心里舒服。','该给的都给到了，性价比这块没得挑。'],s:['性价比很高。','花这个钱很值。']},
  price:{label:'价格实在',l:['价格明明白白，没有隐藏消费。','报价很实在，不会临时加项。','该多少就多少，不会看人下菜碟。','钱花在哪儿都说得很清楚，这点很加分。'],s:['价格很实在。','没有乱收费。']},
  speed:{label:'速度很快',l:['速度是真的快，没怎么等就好了。','效率很高，赶时间也不慌。','流程一点不拖沓，节奏把握得挺好。','以为要等很久，结果比想象中快多了。'],s:['很快，不用等。','效率很高。']},
  ambience:{label:'环境舒服',l:['环境很舒服，灯光和音乐都恰到好处。','干净亮堂，坐着很放松。','空间不大，但布置得很用心。','氛围很松弛，待着不太想走。'],s:['环境很舒服。','氛围很好。']},
  photo:{label:'好看出片',l:['随手一拍都好看，根本不用挑角度。','出片率很高，光一打就很有质感。','细节做得精致，拍出来特别上镜。','发朋友圈都不需要加滤镜。'],s:['很好看，出片。','颜值很高。']},
  quiet:{label:'安静不吵',l:['很安静，不用扯着嗓子说话。','人不多的时候特别舒服，适合慢慢聊。','不吵不闹，聊天完全不费劲。','座位之间有点距离，不会互相打扰。'],s:['安静，适合聊天。','不吵，很舒服。']},
  service:{label:'服务热情',l:['服务态度特别好，全程都很耐心。','很热情，但不会让人觉得有压力。','从进门到离开，服务都跟得上。','有需求说一声就有人应，响应很快。'],s:['服务很好。','态度特别热情。']},
  care:{label:'服务贴心',l:['会主动帮你想到一些你没想到的地方。','细节上照顾得很周到，很贴心。','临走还提醒了注意事项，这点挺暖的。','不是那种客套的周到，是真的在帮你。'],s:['服务很贴心。','细节很周到。']},
  hygiene:{label:'干净卫生',l:['卫生做得到位，看得到的地方都干净。','桌面和器具都很清爽，用着放心。','操作过程看得见，干净是看得见的。','没有异味，整体整洁度很高。'],s:['干净卫生。','很干净，放心。']},
  boss:{label:'老板人好',l:['老板人很实在，聊天很舒服。','能感觉到老板是真的在用心做这件事。','老板会亲自招呼，很有人情味。','老板脾气好，什么都能聊两句。'],s:['老板人很好。','老板很实在。']},
  patient:{label:'耐心细致',l:['问了很多遍也没不耐烦，讲得很清楚。','解释得很细，不懂的地方会再说一遍。','全程不急不催，让人很自在。','会根据你的情况给建议，不是一刀切。'],s:['很有耐心。','讲得很清楚。']},
  nosell:{label:'不推销',l:['全程没有推销，这点太加分了。','不硬推贵的，会站在你的角度给建议。','没有办卡套路，消费得明明白白。','想慢慢挑也不会被围着转。'],s:['不推销，很自在。','没有套路。']},
  pro:{label:'专业靠谱',l:['{who}很专业，一看就是做了很多年的。','技术这块能感觉到功底，不是新手练手。','流程很规范，每一步都有交代。','动手之前先沟通，方案讲得明明白白。'],s:['很专业。','技术很到位。']},
  result:{label:'效果满意',l:['做完的效果比我预想的好，很满意。','变化挺明显的，不是当场好看那种。','按着给的建议做，确实有效果。','结果达到甚至超出了我的预期。'],s:['效果很好。','效果超出预期。']},
  repeat:{label:'回头常客',l:['已经是第好几次来了，水准一直很稳定。','从第一次来就变成常客了，没失望过。','身边的朋友几乎都被我带过来了。','回头客多不是没道理的，稳定才是本事。'],s:['已经来了很多次。','老顾客了，一直很好。']},
  detail:{label:'细节用心',l:['细节上处处有小心思，能感觉到用心。','会记得住客人的喜好，这点很打动我。','很多地方做得比预期多那么一点点。','小地方都照顾到了，整体体验很舒服。'],s:['细节很用心。','处处有小心思。']},
  location:{label:'位置好找',l:['位置好找，导航直接到门口。','出地铁走几分钟就到，很方便。','就在路边，一眼就能看见。','虽然不在最热闹的地方，但很好找。'],s:['位置很好找。','导航直达，方便。']},

/* ---------- 生成器 ---------- */
var used={},last={};
function pick(key,arr){
  var pool=arr.filter(function(x){return !used[key+'|'+x]});
  if(!pool.length){
    Object.keys(used).forEach(function(k){if(k.indexOf(key+'|')===0)delete used[k]});
    pool=arr.filter(function(x){return x!==last[key]});
    if(!pool.length)pool=arr;
  }
  var v=pool[Math.floor(Math.random()*pool.length)];
  used[key+'|'+v]=1;last[key]=v;
  return v;
}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function fill(s,cat,name){
  return s.replace(/\{thing\}/g,cat.thing).replace(/\{who\}/g,cat.who).replace(/\{name\}/g,name||'');
}

function build(cfg){
  var cat=CATS[cfg.cat],st=STYLES[cfg.style],short=cfg.style==='brief';
  var tags=cfg.tags.length?cfg.tags:cat.def;
  var n=cfg.len==='short'?1:(cfg.len==='mid'?2:(Math.random()<.6?3:4));
  if(short&&n>2)n=2;
  var aspects=shuffle(tags).slice(0,n);
  var sv=cat.onsite?SVC[cfg.style]:null;
  var parts=[];
  if(cfg.len!=='short'||short)parts.push(pick('o'+cfg.style,(sv&&sv.open)||st.open));
  if(cfg.detail.trim()){
    var d=cfg.detail.trim().replace(/[。!！~～,，]+$/,'');
    parts.push(d+'。');
  }
  aspects.forEach(function(id){
    var a=A[id];if(!a)return;
    parts.push(fill(pick(id, short?a.s:a.l),cat,cfg.name));
  });
  if(cfg.len==='long'&&!short){
    parts.push(pick('extra',EXTRA));
    if(aspects.length<4)parts.push(pick('extra',EXTRA));
  }
  if(cfg.name.trim()&&cfg.len!=='short')parts.push(fill(pick('named',NAMED),cat,cfg.name.trim()));
  parts.push(pick('c'+cfg.style,(sv&&sv.close)||st.close));
  if(cfg.power!=='normal')parts.push(pick('boost',BOOST));
  if(cfg.power==='strong'&&cfg.len!=='short')parts.push(pick('boost',BOOST));
  var text=parts.join('');
  if(cfg.style==='warm')text+=EMOJI[Math.floor(Math.random()*EMOJI.length)];
  if(cfg.style==='funny'&&Math.random()<.6)text+=EMOJI[Math.floor(Math.random()*EMOJI.length)];
  return text;
}

function chipRow(el,items,isOn,onTap){
  el.innerHTML='';
  items.forEach(function(it){
    var b=document.createElement('button');
    b.type='button';b.className='chip'+(isOn(it)?' on':'');b.textContent=it.label;
    b.onclick=function(){onTap(it);save();renderChips();};
    el.appendChild(b);
  });
}
function catTags(key){
  var c=CATS[key],drop=c.drop||[],out=[];
  function add(t){if(out.indexOf(t)<0&&drop.indexOf(t)<0)out.push(t)}
  c.def.forEach(add);
  COMMON.forEach(add);
  (c.extra||[]).forEach(add);
  return out;
}

async function copy(text){
  if(navigator.clipboard&&window.isSecureContext){
    try{await navigator.clipboard.writeText(text);return true}catch(e){}
  }
  var ta=document.createElement('textarea');
  ta.value=text;ta.setAttribute('readonly','');
  ta.style.cssText='position:fixed;top:0;left:0;opacity:0';
  document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,text.length);
  var ok=false;try{ok=document.execCommand('copy')}catch(e){}
  document.body.removeChild(ta);
  return ok;
}
var toastTimer;
function toast(msg){
  var t=$('#toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show')},1600);
}

function openApp(scheme,fallback){
  var done=false,timer;
  function onVis(){if(document.hidden){done=true;clearTimeout(timer);document.removeEventListener('visibilitychange',onVis)}}
  document.addEventListener('visibilitychange',onVis);
  timer=setTimeout(function(){
    document.removeEventListener('visibilitychange',onVis);
    if(!done&&fallback)window.open(fallback,'_blank','noopener');
  },1600);
  try{window.location.href=scheme}catch(e){}
}

    b.type='button';b.className='plat';
    var d=document.createElement('i');d.style.background=p.color;
    var n=document.createElement('em');n.textContent=p.name;
    b.appendChild(d);b.appendChild(n);
    if(link){var g=document.createElement('span');g.textContent='本店 →';b.appendChild(g)}
    b.onclick=function(){
      var t=lastCopied||shown[0]||'';
      if(t)copySync(t);
      var nm=shopName(),url=link,msg;
      if(!url&&p.scheme&&!inWeChat()){
        var back=(nm&&p.search)?p.search.replace('{kw}',encodeURIComponent(nm)):p.home||'';
        toast((t?'文案已复制 · ':'')+'正在打开'+p.name);
        showHint('在'+p.name+'里点开本店的订单，再长按粘贴',
          ['① 打开后找到本店的那笔订单','② 点「评价」，在输入框长按 → 粘贴，发出去']);
        openApp(p.scheme,back);
        return;
      }
      if(!url&&p.scheme&&inWeChat()){
        toast('微信里打不开 App · 点右上角「在浏览器打开」再用');
        showHint('微信里点不动 App，多一步就好',
          ['① 点右上角「…」→「在浏览器打开」，再点一次「'+p.name+'」',
           '② 或者用下面高亮的「微信里打开美团」，复制口令粘到聊天框点亮',
           '③ 打开订单后点「评价」，长按粘贴']);
        var wb=window.__wxBtn;
        if(wb){
          wb.classList.add('hot');
          try{wb.scrollIntoView({block:'center',behavior:'smooth'})}catch(e){wb.scrollIntoView()}
        }
        return;
      }
      if(!url&&nm&&p.search){
        url=p.search.replace('{kw}',encodeURIComponent(nm));
        msg=(t?'文案已复制 · ':'')+'去'+p.name+'搜「'+nm+'」';
      }else if(!url){
        url=p.home||'';
        msg=(t?'文案已复制 · ':'')+'去'+p.name+'搜一下本店'+(nm?'':'（上面先填下门店名）');
      }else{
        msg=(t?'文案已复制 · ':'')+'正在打开本店';
      }
      if(url)window.open(url,'_blank','noopener');
      toast(msg+' · 到评价框长按粘贴');
      var hint=$('#phint');
      if(hint){
        if(p.order)showHint('没看到写评价的地方？照这三步走',[
          '① 打开'+p.name+' App，点右下角「我的」',
          '② 点「待评价」，找到本店的订单',
          '③ 点「评价」，在输入框长按 → 粘贴，发出去']);
        else hideHint();
      }
    };
    box.appendChild(b);
  });
  if(WX_MP){
    var w=document.createElement('button');
    w.type='button';w.className='plat wide wx';
    var wi=document.createElement('i');wi.style.background='#07C160';
    var wn=document.createElement('em');wn.textContent='微信里打开美团';
    var wg=document.createElement('span');wg.textContent='复制口令 →';
    w.appendChild(wi);w.appendChild(wn);w.appendChild(wg);
    w.onclick=function(){
      w.classList.remove('hot');
      copySync(WX_MP);
      toast('口令已复制 · 粘到微信聊天框点开');
      showHint('微信里打开美团，照这三步走',[
        '① 把刚复制的口令粘到微信聊天框，点一下进美团',
        '② 回到本页点结果卡片的「复制」拿文案',
        '③ 到评价框长按 → 粘贴，发出去']);
    };
    box.appendChild(w);
    window.__wxBtn=w;
  }
}
function render(){
  save();
  var texts=[],i;
  for(i=0;i<3;i++)texts.push(build(cfg));
  shown=texts;
  var out=$('#out');out.innerHTML='';
  texts.forEach(function(t,idx){
    var card=document.createElement('div');card.className='card res';
    var p=document.createElement('p');p.className='txt';p.textContent=t;
    var foot=document.createElement('div');foot.className='foot';
    var len=document.createElement('span');len.className='len';
    len.textContent='第 '+(idx+1)+' 条 · '+t.replace(/\s/g,'').length+' 字';
    var btn=document.createElement('button');btn.className='cp';btn.textContent='复制';
    btn.onclick=async function(){
      var ok=await copy(t);
      if(ok){lastCopied=t;btn.textContent='已复制 ✓';btn.classList.add('done');toast('已复制 · 可在下面选平台发布');
        setTimeout(function(){btn.textContent='复制';btn.classList.remove('done')},1800);
      }else{toast('复制失败，请长按文字手动复制')}
    };
    foot.appendChild(len);foot.appendChild(btn);
    card.appendChild(p);card.appendChild(foot);
    out.appendChild(card);
  });
}

document.addEventListener('DOMContentLoaded',function(){
  restore();
  renderChips();
  renderPlats();
  $('#gen').onclick=render;
  $('#reroll').onclick=render;
  $('#name').addEventListener('input',save);
  $('#detail').addEventListener('input',save);
});
</script>
</body>
</html>
